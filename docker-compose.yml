version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: meetrecall-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: meetrecall
      POSTGRES_PASSWORD: meetrecall_pass
      POSTGRES_DB: meetrecall_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meetrecall-net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: meetrecall-backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: meetrecall
      DB_PASS: meetrecall_pass
      DB_NAME: meetrecall_db
    depends_on:
      db:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8001/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - meetrecall-net

  frontend:
    build: ./frontend
    container_name: meetrecall-frontend
    ports:
      - "3005:3005"
    volumes:
      - ./frontend:/app
    environment:
      BACKEND_URL: http://backend:8001/api/v1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - meetrecall-net

volumes:
  postgres_data:


networks:
  meetrecall-net:
    driver: bridge
